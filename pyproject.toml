[project]
name = "lobanov"
dynamic = ["version"]
description = "Medical Documentation Assistant Backend"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Andrew Podvigin", email = "podviginandrej@gmail.com" },
]
dependencies = [
    "aiofiles>=25.1.0",
    "alembic[tz]>=1.18.4",
    "asyncpg>=0.31.0",
    "dishka>=1.10.0",
    "jinja2>=3.1.6",
    "fastapi>=0.136.0",
    "loguru>=0.7.3",
    "bcrypt>=4.0.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.13.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "accelerate>=1.11.0",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.44.0",
    "fpdf2>=2.8.7",
    "httpx>=0.28.0",
    "transformers>=5.7.0",
    "huggingface-hub>=0.30.0",
    # GigaAM (ai-sage/GigaAM-v3) remote modeling imports these before load
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "sentencepiece>=0.2.0",
    "pyannote-audio>=3.3.2",
    "jiwer>=3.0.0",
    "bert-score>=0.3.13",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform != 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform != 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[dependency-groups]
dev = [
    "hatch>=1.16.5",
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
only-packages = true
packages = ["lobanov"]

[tool.hatch.version]
path = "lobanov/__version__.py"

[tool.uv]
package = true

[tool.mypy]
plugins = "pydantic.mypy"
exclude = [".venv", "models"]

[tool.ruff]
exclude = [".venv", "models"]
line-length = 120
indent-width = 4
target-version = "py312"
fix = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = ["ANN", "D", "EM101", "RUF001", "BLE001", "SIM103", "ASYNC109", "TRY003", "PLW0602", "TC001", "ISC003", "COM812", "RUF003", "RUF002", "TRY301"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "TID252", "PLC0414"]
"**/{tests,docs,tools}/*" = ["E402"]
"tests/**/*" = ["S101"]
"*_test.py" = ["ANN", "S", "S101", "TRY", "PGH003", "FBT", "PT012", "N801", "ARG002", "SLF001", "PLR", "SIM"]
"scripts/*" = ["T201", "ASYNC", "A004", "A001", "TRY003", "SLF001"]
"alembic/*" = ["INP001"]
"experiments/*/bench_*.py" = ["G004", "PLE1205"]
"experiments/analyze_results.py" = ["T201"]
"experiments/nlp/analyze_nlp_results.py" = ["T201"]
"experiments/nlp/plot_nlp_results.py" = ["T201"]
"experiments/stt/plot_stt_results.py" = ["T201", "TC002"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pycodestyle]
max-line-length = 128

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
