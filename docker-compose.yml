services:
  lobanov_postgres:
    image: postgres:17-alpine
    environment:
      PG_APP_USERNAME: ${PG_APP_USERNAME:-lobanov}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-lobanov}
      PG_APP_DATABASE: ${PG_APP_DATABASE:-lobanov}
      POSTGRES_USER: ${PG_ADM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_ADM_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_ADM_DATABASE:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./lobanov/infra/postgres_init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  lobanov_server:
    build:
      context: .
      dockerfile: dockerfile
    container_name: lobanov-server
    restart: unless-stopped
    working_dir: /app
    command: sh -c "alembic upgrade head && exec python -m lobanov.app"
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
      - lobanov-storage:/app/storage
    depends_on:
      lobanov_postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  lobanov_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lobanov-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      lobanov_server:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  lobanov-storage:
    driver: local
