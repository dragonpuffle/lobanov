services:
  lobanov_server:
    build:
      context: .
      dockerfile: dockerfile
    container_name: lobanov-server
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - 127.0.0.1:8000:8000
    command: ["uv", "-q", "run", "python3", "-m", "lobanov", "server"]
    depends_on:
      lobanov_postgres:
        condition: service_healthy

  lobanov_postgres:
    image: postgres:17-alpine
    environment:
      PG_APP_USERNAME: ${PG_APP_USERNAME:-lobanov}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-lobanov}
      PG_APP_DATABASE: ${PG_APP_DATABASE:-lobanov}
      POSTGRES_USER: ${PG_ADM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_ADM_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_ADM_DATABASE:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./lobanov/infra/postgres_init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 60s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
